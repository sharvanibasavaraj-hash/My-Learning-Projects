<!DOCTYPE html>
<html>
    <head><title>Appointment details</title>
    <style>
.appointment{
    font-weight: bold;
    color:blue;
   white-space: nowrap;
    position: absolute;
    right:200px;
    word-spacing:10px;
   
}  .top{
            display:flex;
            justify-content: space-around;
            background-color: white;
            height:48px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
        .top h4{
            position:absolute;
            top:-15px;
            left:110px;
            font-size:20px;
        }
        .top p100{
            position:absolute;
            top:35px;
            left:110px;
            font-size:15px;
        }

        .topbut{
            position: absolute;
            right:70px;
            top:15px;
            word-spacing:40px;
            
        }
        .topbut button{
            border:none;
            padding:10px;
            color:black;
            background-color: white;
            font-size:15px;
            cursor:pointer;
        }
        .topbut button:hover{
            transform: scale(1.1);
            color: rgb(5, 182, 241);
        }
        .top img{
            width:60px;
            height:40px;
            position:absolute;
            left:50px;
            top:15px;
        }
        .span button{
    background-color: #2864d7;
    color: white;
    border-radius: 5px;
    padding:7px;
}.lastt{
    display:flex;
    justify-content: flex-start;
    gap:10px;
    background-color: #2864d7;
    height:40px;
    width:1240px;
    position:absolute;
    top:510px;
    left:-400px;
    word-spacing: 0px;
}
.lastt p15{
    position: absolute;
    left:150px;
    top:10px;
}
.lastt p16{
    position: absolute;
    right:350px;
    top:10px;
}
.lastt .fb{
    width:20px;
    height:20px;
    position:absolute;
    left:900px;
    top:10px;
}
.lastt .insta{
    width:20px;
    height:20px;
    position:absolute;
    left:930px;
    top:10px;
}
.lastt .twitt{
    width:20px;
    height:20px;
    position:absolute;
    left:960px;
    top:10px;
}
.lastt .yt{
    width:20px;
    height:20px;
    position:absolute;
    left:990px;
    top:10px;
}
    </style></head>
    <body>
    
        <div class="top">
            <img src="med.jpeg"></img>
            <h4>MediCare+</h4>
            <p100>Your health,Our Priority</p100>
            <div class="topbut">
                <button>Home</button>
                <button>Doctors</button>
                <button>Services</button>
                 <button>About Us</button>
                 <button>Contact Us</button>
                 <span class="span"> <button>Appointment History</button></span>
        <h1 class="appointment">Congratulations! Your Appointment is booked</h1>
         <div class="lastt">
        <p15>2026 MediCare+. All Rights Reserved.</p15>
         <p16>Follow us on:</p16>
      
           
             <img class="insta" src="insta.jpeg">
              <img class="fb" src="fb.jpeg"></img>
         <img class="twitt" src="twitt.jpeg"></img>
           <img class="yt" src="yt.jpeg"></img>
            
       
       </div>
    </body>
</html>
